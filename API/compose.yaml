services:
  api:
    build:
      context: ..
      dockerfile: API/Dockerfile
    ports:
      - "127.0.0.1:${TRIPFLOW_API_PORT:-8000}:8000"
    environment:
      TRIPFLOW_PORTAL_ADMIN_EMAIL: ${TRIPFLOW_PORTAL_ADMIN_EMAIL:-}
      TRIPFLOW_PORTAL_ADMIN_PASSWORD: ${TRIPFLOW_PORTAL_ADMIN_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - api-state:/app/API/.state

volumes:
  api-state:
