services:
  api:
    build:
      context: ..
      dockerfile: API/Dockerfile
    ports:
      - "127.0.0.1:${TRIPFLOW_API_PORT:-8000}:8000"
    environment:
      TRIPFLOW_PORTAL_ADMIN_EMAIL: ${TRIPFLOW_PORTAL_ADMIN_EMAIL:-}
      TRIPFLOW_PORTAL_ADMIN_PASSWORD: ${TRIPFLOW_PORTAL_ADMIN_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      HOTEL_SEARCH_PROFILE: ${HOTEL_SEARCH_PROFILE:-B}
      HOTEL_ENRICHMENT: ${HOTEL_ENRICHMENT:-on}
    volumes:
      - api-state:/app/API/.state

volumes:
  api-state:
